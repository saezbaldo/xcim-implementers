name: Validate XCIM draft

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python validation dependencies
        run: python -m pip install -r tools/requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate schemas and verify deterministic vectors
        run: python tools/xcim_check.py
